<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Atividade 01</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }
        .box {
            border: 1px solid #ccc;
            padding: 20px;
            width: 350px;
        }
        label {
            display: inline-block;
            width: 110px;
        }
        input {
            padding: 5px;
            margin: 5px 0;
        }
        button {
            padding: 6px 15px;
            background: royalblue;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        #resultado {
            margin-top: 20px;
            display: none;
        }
    </style>
</head>
<body>

    <h2>Atividade 01</h2>

    <div class="box">
        <label>Nome Completo:</label>
        <input type="text" id="nomeCompleto">
        <button onclick="separar()"> &gt;&gt; </button>
    </div>

    <div id="resultado" class="box">
        <p><label>Nome:</label>
        <input type="text" id="nome" readonly></p>

        <p><label>Sobrenome:</label>
        <input type="text" id="sobrenome" readonly></p>
    </div>

    <script>
        function separar() {
            let nomeCompleto = document.getElementById("nomeCompleto").value.trim();

            if (nomeCompleto === "") {
                alert("Digite o nome completo!");
                return;
            }

            let partes = nomeCompleto.split(" ");
            let primeiroNome = partes[0];
            let ultimoSobrenome = partes.slice(1).join(" ");

            document.getElementById("nome").value = primeiroNome;
            document.getElementById("sobrenome").value = ultimoSobrenome;

            document.getElementById("resultado").style.display = "block";
        }
    </script>

</body>
</html>
