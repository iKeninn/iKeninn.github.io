<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" type="image/jpg" href="img/favicon.ico"/>
    <title>Robotron 2000</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@300;500&display=swap" rel="stylesheet"> 
</head>
<body>
    <main>
        <section class="robotron">
            <img class="robo" src="https://cdn.discordapp.com/attachments/850725229814218776/1439984917332234280/robotron-amarelo.png?ex=6925bc75&is=69246af5&hm=8103b6c1776a16bd8ab5a8cd958a704b306be7f628cdebea99ff2f7257fd886c&" alt="Robotron">
            <figcaption class="titulo">ROBOTRON <br>2000</figcaption>

            <!-- BOTÕES TROCA DE COR -->
            <div class="troca-cor">
                <button id="prev" class="btn-cor"><<</button>
                <button id="next" class="btn-cor">>></button>
            </div>
        </section>

        <section class="box estatisticas">
            <div class="estatistica">
                <p class="estatistica-titulo">Força</p>
                <div class="estatistica-valor">
                    <p class="estatistica-numero">768</p>
                </div>
            </div>
            <div class="estatistica">
                <p class="estatistica-titulo">Poder</p>
                <div class="estatistica-valor">
                    <p class="estatistica-numero">630</p>
                </div>
            </div>
            <div class="estatistica">
                <p class="estatistica-titulo">Energia</p>
                <div class="estatistica-valor">
                    <p class="estatistica-numero">289</p>
                </div>
            </div>
            <div class="estatistica">
                <p class="estatistica-titulo">Velocidade</p>
                <div class="estatistica-valor">
                    <p class="estatistica-numero">597</p>
                </div>
            </div>
        </section>

        <section class="equipamentos">
            <form action="" class="montador">
                <div class="box montador-conteudo">
                    <div class="peca">
                        <label class="peca-titulo">Braços</label>
                        <div class="controle">
                            <button class="controle-ajuste">-</button>
                            <input type="text" class="controle-contador" value="00">
                            <button class="controle-ajuste">+</button>
                        </div>
                    </div>
                    <hr class="linha">

                    <div class="peca">
                        <label class="peca-titulo">Blindagem</label>
                        <div class="controle">
                            <button class="controle-ajuste">-</button>
                            <input type="text" class="controle-contador" value="00">
                            <button class="controle-ajuste">+</button>
                        </div>
                    </div>
                    <hr class="linha">

                    <div class="peca">
                        <label class="peca-titulo">Núcleos</label>
                        <div class="controle">
                            <button class="controle-ajuste">-</button>
                            <input type="text" class="controle-contador" value="00">
                            <button class="controle-ajuste">+</button>
                        </div>
                    </div>
                    <hr class="linha">

                    <div class="peca">
                        <label class="peca-titulo">Pernas</label>
                        <div class="controle">
                            <button class="controle-ajuste">-</button>
                            <input type="text" class="controle-contador" value="00">
                            <button class="controle-ajuste">+</button>
                        </div>
                    </div>
                    <hr class="linha">

                    <div class="peca">
                        <label class="peca-titulo">Foguetes</label>
                        <div class="controle">
                            <button class="controle-ajuste">-</button>
                            <input type="text" class="controle-contador" value="00">
                            <button class="controle-ajuste">+</button>
                        </div>
                    </div>
                </div>
                <input type="submit" value="Iniciar produção" class="producao" id="producao">
            </form>
        </section>
    </main>

    <!-- SCRIPT DE FUNCIONAMENTO -->
    <script>
        const cores = [
            "https://cdn.discordapp.com/attachments/850725229814218776/1439985054687428748/robotron-vermelho.png?ex=6925bc96&is=69246b16&hm=8865ff40e0ff86c3c5fad1b6b321c142240fe1d0cc9f8e1762ac076737433724&",
            "https://cdn.discordapp.com/attachments/850725229814218776/1439985029039132723/robotron-rosa.png?ex=6925bc90&is=69246b10&hm=3523e00b170e922f43ed68be823b804469b923b0a4421a83a772d7ce87c1d914&",
            "https://cdn.discordapp.com/attachments/850725229814218776/1439984977373823027/robotron-branco.png?ex=6925bc84&is=69246b04&hm=b183b6a310837641e7b03755ae8dd4adebb902aaff145115686e8a1d9d83ef15&",
            "https://cdn.discordapp.com/attachments/850725229814218776/1439985011129319525/robotron-preto.png?ex=6925bc8c&is=69246b0c&hm=90b0862db5b0ee9a8d597a8b0f1d19df2718a2071bdf4fcb9dbd4a314b9c63d6&",
            "https://cdn.discordapp.com/attachments/850725229814218776/1439984917332234280/robotron-amarelo.png?ex=6925bc75&is=69246af5&hm=8103b6c1776a16bd8ab5a8cd958a704b306be7f628cdebea99ff2f7257fd886c&",
            "https://cdn.discordapp.com/attachments/850725229814218776/1439984955529629750/robotron-azul.png?ex=6925bc7f&is=69246aff&hm=bf9b188b1b7b165246fdaed1eb1bad9bd9123a12f62b4d179157b948e744476c&"
        ];

        let indice = 0;
        const robotron = document.querySelector(".robo");

        document.getElementById("prev").onclick = () => {
            indice = (indice - 1 + cores.length) % cores.length;
            robotron.src = "img/" + cores[indice];
        };

        document.getElementById("next").onclick = () => {
            indice = (indice + 1) % cores.length;
            robotron.src = "img/" + cores[indice];
        };

        // Controle de peças
        const controles = document.querySelectorAll(".controle-ajuste");

        controles.forEach((botao) => {
            botao.addEventListener("click", (evento) => {
                evento.preventDefault();

                const operacao = evento.target.textContent;
                const contador = evento.target.parentNode.querySelector(".controle-contador");

                let valor = parseInt(contador.value);

                if (operacao === "+" && valor < 10) valor++;
                if (operacao === "-" && valor > 0) valor--;

                contador.value = valor < 10 ? "0" + valor : valor;
            });
        });
    </script>

</body>
</html>
