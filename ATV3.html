<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robotron 2000</title>

<style>
:root {
    --main-cinza: #CCCCCC;
    --main-branco: #FFFFFF;
    --main-preto: #000000;
}

* {
    box-sizing: border-box;
}

body {
    background: url(../img/fundo.jpg);
    background-position: center center;
    background-size: cover cover;
    padding: 0;
    margin: 0;
    font-weight: 300;
}

body, input {
    font-family: 'Teko', sans-serif;
}

main {
    width: 80vw;
    height: 80vh;
    margin: 10vh 8vw 10vh 12vw;
    display: flex;
    gap: 1vw;
}

/* ROBOTRON ESQUERDA */
.robotron {
    background: url(../img/estrutura.png) no-repeat;
    background-position: center center;
    margin: 0;
    flex-basis: 40%;
    position: relative;
}

.robo {
    height: 110%;
    z-index: 1;
    position: absolute;
    left: -20%;
    top: -5%;
}

.titulo {
    transform: rotate(180deg);
    font-weight: 500;
    font-size: 130px;
    position: absolute;
    bottom: 7rem;
    left: -3rem;
    line-height: 0.8;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    color: rgba(255,255,255,0.8)
}

/* ---- CONTROLE DAS CORES ---- */
.controle-cor {
    position: absolute;
    bottom: 20px;
    left: 20px;
    display: flex;
    gap: 10px;
    z-index: 10;
}

.controle-cor button {
    background: rgba(0,0,0,0.7);
    color: white;
    width: 55px;
    height: 55px;
    border-radius: 10px;
    font-size: 2rem;
    border: 2px solid white;
    cursor: pointer;
}

/* BOX DO MEIO */
.box {
    background: rgba(0,0,0,0.6);
    clip-path: polygon(calc(100% - 30px) 0, 100% 30px, 100% calc(100% - 30px), calc(100% - 30px) 100%, 30px 100%, 0 calc(100% - 30px), 0 30px, 30px 0);
    border-left: 5px solid var(--main-cinza);
    height: 80%;
}

/* EQUIPAMENTOS */
.equipamentos {
    flex-basis: 32%;
}

.montador {
    height: 100%;;
}

.montador-conteudo {
    padding: 2em 10%;
}

.peca {
    padding: 1em 0;
}

.peca-titulo {
    color: var(--main-branco);
    text-transform: uppercase;
    font-size: 2.5em;
}

.controle {
    background: var(--main-preto);
    border-radius: 25px;
    float: right;
    display: inline-flex;
    padding: 5px;
    align-items: center;
    align-self: flex-end;
}

.controle-contador {
    width: 40px;
    height: 35px;
    background: none;
    border: 0;
    margin: 0 1rem;
    color: var(--main-branco);
    text-align: center;
    font-size: 2.5em;
    display: inline-flex;
    align-items: center;
    padding-top: 8px;
}

.controle-ajuste {
    display: inline-block;
    width: 40px;
    height: 40px;
    line-height: 44px;
    border-radius: 50%;
    color: var(--main-cinza);
    font-size: 4em;
    background: var(--main-preto);
    text-align: center;
    border: 3px solid var(--main-cinza);
    cursor: pointer;
}

.linha {
    border-color: var(--main-cinza);
}

.producao {
    margin-top: 1em;
    font-size: 2em;
    text-transform: uppercase;
    padding: 0.2em 1em;
    float: right;
    border: 3px solid var(--main-branco);
    background: var(--main-branco);
    clip-path: polygon(100% 0, 100% calc(100% - 30px), calc(100% - 30px) 100%, 0 100%, 0 0);
    cursor: pointer;
}

.producao:hover {
    background: var(--main-preto);
    color: var(--main-branco)
}

/* ESTATÍSTICAS */
.estatisticas {
    flex-basis: 23%;
    padding: 2em 2em 0;
}

.estatistica {
    color: var(--main-branco);
    display: flex;
    align-items: flex-start;
    height: 25%;
}

.estatistica-titulo {
    font-size: 1.5em;
    border-bottom: 1px solid var(--main-cinza);
    flex-basis: 40%;
    text-transform: uppercase;
    order: 1
}

.estatistica-valor {
    flex-basis: 60%;
    position: relative;
    margin: 10px 0 0;
    order: 2;
    margin: -10px 0 0;
}

.estatistica-valor::after {
    content: "";
    display: block;
    padding-bottom: 100%;
    border: 1px solid var(--main-cinza);
    border-radius: 50%;
}

.estatistica-numero {
    position: absolute;
    top: 50%;
    transform: translateY(-46%);
    width: 100%;
    line-height: 100%;
    text-align: center;
    font-size: 3em;
    margin: 0;
}

.estatistica:nth-child(2n) .estatistica-titulo {
    order: 2;
    text-align: right;
}

.estatistica:nth-child(2n) .estatistica-valor {
    order: 1;
    flex-basis: 35%;
    margin: 10px 0 0;
}

/* RESPONSIVO */
@media screen and (max-width: 1600px) {
    body { font-size: 14px; }
    main { width: 90vw; height: 80vh; margin: 5vh auto; }
}

@media screen and (max-width: 1200px) {
    body { font-size: 13px; }
    main { width: 96vw; height: 80vh; margin: 10vh auto; }
}
</style>
</head>

<body>

<main>

    <div class="robotron">

        <img id="robo" class="robo" src="img/robotron-azul.png">

        <div class="controle-cor">
            <button id="btn-voltar">«</button>
            <button id="btn-avancar">»</button>
        </div>

    </div>

    <div class="box"></div>

    <div class="estatisticas">
        <div class="estatistica">
            <div class="estatistica-titulo">Força</div>
            <div class="estatistica-valor"><p class="estatistica-numero">10</p></div>
        </div>

        <div class="estatistica">
            <div class="estatistica-titulo">Velocidade</div>
            <div class="estatistica-valor"><p class="estatistica-numero">20</p></div>
        </div>

        <div class="estatistica">
            <div class="estatistica-titulo">Poder</div>
            <div class="estatistica-valor"><p class="estatistica-numero">15</p></div>
        </div>

        <div class="estatistica">
            <div class="estatistica-titulo">Resistência</div>
            <div class="estatistica-valor"><p class="estatistica-numero">12</p></div>
        </div>
    </div>

</main>

<script>
/* --- SISTEMA DE TROCA DE CORES --- */

const imagens = [
    "https://cdn.discordapp.com/attachments/850725229814218776/1439984917332234280/robotron-amarelo.png?ex=691c81f5&is=691b3075&hm=1608315e416b2b64622fc3d69705f756535a747419404a918f7f8c526683c779&",
    "https://cdn.discordapp.com/attachments/850725229814218776/1439984955529629750/robotron-azul.png?ex=691c81ff&is=691b307f&hm=0d87da47ac380aeeeb8630b79ec8f673ee3c0da7a5b9ad703f02977010e77a76&",
    "https://cdn.discordapp.com/attachments/850725229814218776/1439984977373823027/robotron-branco.png?ex=691c8204&is=691b3084&hm=7339adcf9e2b87694131c2edaeab6f12846356fab58edc75f6cdac6b3150d2aa&",
    "https://cdn.discordapp.com/attachments/850725229814218776/1439985011129319525/robotron-preto.png?ex=691c820c&is=691b308c&hm=ebbe2c0a8d88aea71e62c58b32ea85e315549714cb9bf8adc5fd537449ad59f5&",
    "https://cdn.discordapp.com/attachments/850725229814218776/1439985029039132723/robotron-rosa.png?ex=691c8210&is=691b3090&hm=eec4fd372055b63b2ed9e7f01d0ff8bcea680ebd662d0cf7d1c3acabf41b341a&",
    "https://cdn.discordapp.com/attachments/850725229814218776/1439985054687428748/robotron-vermelho.png?ex=691c8216&is=691b3096&hm=fcb0637214ea3f451eba2a9b260ae6cf05373b4358c9faf2a88cbb234f72318a&"
];

let pos = 0;
const robo = document.getElementById("robo");

document.getElementById("btn-avancar").addEventListener("click", () => {
    pos++;
    if (pos >= imagens.length) pos = 0;
    robo.src = imagens[pos];
});

document.getElementById("btn-voltar").addEventListener("click", () => {
    pos--;
    if (pos < 0) pos = imagens.length - 1;
    robo.src = imagens[pos];
});
</script>

</body>
</html>
