<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" type="image/jpg" href="img/favicon.ico"/>
    <title>Robotron 2000</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@300;500&display=swap" rel="stylesheet"> 
</head>
<body>
    <main>
        <section class="robotron">
            <img id="robo" class="robo" src="img/robotron-azul.png" alt="Robotron">
            <figcaption class="titulo">ROBOTRON <br>2000</figcaption>

            <div style="position:absolute; bottom:20px; left:20px; display:flex; gap:10px; z-index:10;">
                <button id="btn-voltar" class="controle-ajuste">«</button>
                <button id="btn-avancar" class="controle-ajuste">»</button>
            </div>
        </section>

        <section class="box estatisticas">
            <div class="estatistica">
                <p class="estatistica-titulo">Força</p>
                <div class="estatistica-valor"><p class="estatistica-numero" id="forca">50</p></div>
            </div>
            <div class="estatistica">
                <p class="estatistica-titulo">Poder</p>
                <div class="estatistica-valor"><p class="estatistica-numero" id="poder">30</p></div>
            </div>
            <div class="estatistica">
                <p class="estatistica-titulo">Energia</p>
                <div class="estatistica-valor"><p class="estatistica-numero" id="energia">40</p></div>
            </div>
            <div class="estatistica">
                <p class="estatistica-titulo">Velocidade</p>
                <div class="estatistica-valor"><p class="estatistica-numero" id="velocidade">40</p></div>
            </div>
        </section>

        <section class="equipamentos">
            <form action="" class="montador" id="form-producao">
                <div class="box montador-conteudo">
                    <div class="peca">
                        <label class="peca-titulo">Braços</label>
                        <div class="controle">
                            <buttom class="controle-ajuste">-</buttom>
                            <input type="text" class="controle-contador" value="00">
                            <buttom class="controle-ajuste">+</buttom>
                        </div>
                    </div>
                    <hr class="linha">

                    <div class="peca">
                        <label class="peca-titulo">Blindagem</label>
                        <div class="controle">
                            <buttom class="controle-ajuste">-</buttom>
                            <input type="text" class="controle-contador" value="00">
                            <buttom class="controle-ajuste">+</buttom>
                        </div>
                    </div>
                    <hr class="linha">

                    <div class="peca">
                        <label class="peca-titulo">Núcleos</label>
                        <div class="controle">
                            <buttom class="controle-ajuste">-</buttom>
                            <input type="text" class="controle-contador" value="00">
                            <buttom class="controle-ajuste">+</buttom>
                        </div>
                    </div>
                    <hr class="linha">

                    <div class="peca">
                        <label class="peca-titulo">Pernas</label>
                        <div class="controle">
                            <buttom class="controle-ajuste">-</buttom>
                            <input type="text" class="controle-contador" value="00">
                            <buttom class="controle-ajuste">+</buttom>
                        </div>
                    </div>
                    <hr class="linha">

                    <div class="peca">
                        <label class="peca-titulo">Foguetes</label>
                        <div class="controle">
                            <buttom class="controle-ajuste">-</buttom>
                            <input type="text" class="controle-contador" value="00">
                            <buttom class="controle-ajuste">+</buttom>
                        </div>
                    </div>
                </div>

                <input type="submit" value="Iniciar produção" class="producao" id="producao">
            </form>
        </section>

        <!-- ⬅ nova área de robôs produzidos -->
        <section id="producao-area" class="box" style="flex-basis:20%; padding:20px; overflow-y:auto;">
            <h2 style="color:white; text-align:center;">Produção</h2>
        </section>

    </main>

<script>
/* ---------------- TROCA DE CORES ---------------- */

const imagens = [
    "img/robotron-azul.png",
    "img/robotron-amarelo.png",
    "img/robotron-preto.png",
    "img/robotron-branco.png",
    "img/robotron-rosa.png",
    "img/robotron-vermelho.png"
];

const stats = {
    azul:{forca:50,poder:30,energia:40,velocidade:40},
    amarelo:{forca:30,poder:20,energia:30,velocidade:70},
    preto:{forca:80,poder:40,energia:50,velocidade:30},
    branco:{forca:40,poder:40,energia:40,velocidade:40},
    rosa:{forca:25,poder:20,energia:30,velocidade:60},
    vermelho:{forca:70,poder:80,energia:50,velocidade:50}
};

let pos = 0;
const robo = document.getElementById("robo");

function atualizarStats() {
    const nome = imagens[pos].replace("img/robotron-", "").replace(".png", "");
    const s = stats[nome];

    document.getElementById("forca").textContent = s.forca;
    document.getElementById("poder").textContent = s.poder;
    document.getElementById("energia").textContent = s.energia;
    document.getElementById("velocidade").textContent = s.velocidade;
}

document.getElementById("btn-avancar").onclick = () => {
    pos = (pos + 1) % imagens.length;
    robo.src = imagens[pos];
    atualizarStats();
};

document.getElementById("btn-voltar").onclick = () => {
    pos = (pos - 1 + imagens.length) % imagens.length;
    robo.src = imagens[pos];
    atualizarStats();
};

atualizarStats();

/* ---------------- PRODUÇÃO ---------------- */

document.getElementById("form-producao").addEventListener("submit", (e) => {
    e.preventDefault();

    const novo = document.createElement("img");
    novo.src = imagens[pos];
    novo.style.width = "120px";
    novo.style.display = "block";
    novo.style.margin = "10px auto";

    document.getElementById("producao-area").appendChild(novo);
});
</script>

</body>
</html>
