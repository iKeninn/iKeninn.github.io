<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Atividade 06 - Controle de Gastos</title>
<style>
    body { font-family: Arial, sans-serif; margin: 20px; display: flex; gap: 40px; }
    .container { width: 45%; }
    h2 { text-align: center; }
    label { display: block; margin-top: 10px; }
    input, select { width: 100%; padding: 6px; margin-top: 4px; }
    button { margin-top: 12px; padding: 8px 12px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    table, th, td { border: 1px solid #000; }
    th, td { padding: 8px; text-align: center; }
    #resumoBox { border: 1px solid #000; padding: 20px; }
</style>
</head>
<body>

<div class="container">
<h2>Controle de Gastos</h2>
<label>Categoria:</label>
<select id="categoria">
    <option>Mercado</option>
    <option>Transporte</option>
    <option>Contas</option>
    <option>Lazer</option>
</select>

<label>Valor:</label>
<input type="number" id="valor" step="0.01">

<label>Data:</label>
<input type="date" id="data">

<button onclick="adicionar()">Adicionar</button>
<button onclick="calcular()">Calcular</button>

<table>
<thead>
<tr>
    <th>Categoria</th>
    <th>Data</th>
    <th>Valor</th>
</tr>
</thead>
<tbody id="tabela"></tbody>
</table>
</div>

<div class="container">
<h2>Resumo</h2>
<div id="resumoBox">
    <p>Total: 0</p>
    <p>Total no Mês 03: 0</p>
    <p>Total no Mês 04: 0</p>
    <p>Total de gastos com Mercado: 0</p>
</div>
</div>

<script>
let dados = [];

function adicionar() {
    const categoria = document.getElementById("categoria").value;
    const valor = parseFloat(document.getElementById("valor").value);
    const data = document.getElementById("data").value;

    if (!valor || !data) {
        alert("Preencha todos os campos!");
        return;
    }

    dados.push({ categoria, valor, data });

    atualizarTabela();
}

function atualizarTabela() {
    const tabela = document.getElementById("tabela");
    tabela.innerHTML = "";

    dados.forEach(item => {
        tabela.innerHTML += `
            <tr>
                <td>${item.categoria}</td>
                <td>${item.data}</td>
                <td>${item.valor.toFixed(2)}</td>
            </tr>
        `;
    });
}

function calcular() {
    let total = 0;
    let mes03 = 0;
    let mes04 = 0;
    let mercadoTotal = 0;

    dados.forEach(item => {
        total += item.valor;

        const mes = item.data.split("-")[1];

        if (mes === "03") mes03 += item.valor;
        if (mes === "04") mes04 += item.valor;
        if (item.categoria === "Mercado") mercadoTotal += item.valor;
    });

    const box = document.getElementById("resumoBox");
    box.innerHTML = `
        <p>Total: ${total.toFixed(2)}</p>
        <p>Total no Mês 03: ${mes03.toFixed(2)}</p>
        <p>Total no Mês 04: ${mes04.toFixed(2)}</p>
        <p>Total de gastos com Mercado: ${mercadoTotal.toFixed(2)}</p>
    `;
}
</script>

</body>
</html>
