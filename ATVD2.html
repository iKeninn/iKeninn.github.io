<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cálculo do IMC</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }
        h2 {
            text-align: center;
            font-size: 32px;
            color: #3b6db3;
        }
        .container {
            border: 1px solid #ccc;
            padding: 25px;
            width: 600px;
            margin: auto;
        }
        .form-box {
            border: 1px solid #92b3e8;
            padding: 20px;
            width: 450px;
            margin: auto;
        }
        label {
            display: inline-block;
            width: 80px;
            margin-bottom: 5px;
        }
        input {
            padding: 5px;
            margin: 5px 0;
            width: 200px;
        }
        button {
            margin-top: 10px;
            padding: 8px 15px;
            background: #3b6db3;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        #resultado {
            margin-top: 15px;
            border: 1px solid #ccc;
            padding: 10px;
            width: 250px;
            height: 60px;
            display: none;
        }
    </style>

</head>
<body>

    <h2>Cálculo do IMC</h2>

    <div class="container">

        <div class="form-box">

            <p>
                <label>Nome:</label>
                <input type="text" id="nome">
            </p>

            <p>
                <label>Peso:</label>
                <input type="number" id="peso" step="0.1">
            </p>

            <p>
                <label>Altura:</label>
                <input type="number" id="altura" step="0.01">
            </p>

            <button onclick="calcularIMC()">Calcular IMC</button>

            <div id="resultado"></div>

        </div>

    </div>

    <script>
        function calcularIMC() {
            let nome = document.getElementById("nome").value;
            let peso = parseFloat(document.getElementById("peso").value);
            let altura = parseFloat(document.getElementById("altura").value);

            if (!nome || !peso || !altura) {
                alert("Preencha todos os campos");
                return;
            }

            let imc = peso / (altura * altura);
            let imcFormatado = imc.toFixed(2);

            let caixaResultado = document.getElementById("resultado");
            caixaResultado.style.display = "block";
            caixaResultado.innerHTML = 
                `Olá, ${nome}. <br>O seu IMC é de <b>${imcFormatado}</b>`;
        }
    </script>

</body>
</html>
